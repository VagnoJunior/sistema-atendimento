<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Clientes</title>
</head>
<body>
    <h1>Cadastro de Clientes</h1>

    <form method="POST">
        <input type="text" name="nome" placeholder="Nome do cliente" required><br><br>
        <input type="text" name="telefone" placeholder="Telefone" required><br><br>
        <input type="email" name="email" placeholder="Email (opcional)"><br><br>
        <button type="submit">Salvar</button>
    </form>

    <hr>

    <h2>Clientes Cadastrados</h2>
    <ul>
        {% for cliente in clientes %}
            <li>
                {{ cliente[1] }} – {{ cliente[2] }} – {{ cliente[3] }}
            </li>
        {% endfor %}
    </ul>

    <br>
    <a href="/">Voltar</a>
</body>
</html>
