<!DOCTYPE html>
<html>
<head>
    <title>Atendimentos</title>
    <style>
        body { font-family: Arial; margin:20px; background:#f4f4f4; }
        table { width:100%; border-collapse: collapse; margin-top:10px; }
        th, td { border:1px solid #ccc; padding:8px; text-align:left; }
        input, select, textarea { margin:5px; padding:5px; }
        button { padding:5px 10px; background:#28a745; color:white; border:none; cursor:pointer; }
    </style>
</head>
<body>
    <h2>Atendimentos</h2>

    <form method="GET">
        <input type="text" name="busca" placeholder="Buscar cliente ou assunto" value="{{ busca }}">
        <button>Buscar</button>
    </form>

    <form method="POST">
        <select name="cliente" required>
            <option value="">Selecione o cliente</option>
            {% for cl in clientes %}
            <option value="{{ cl[0] }}">{{ cl[1] }}</option>
            {% endfor %}
        </select>
        <input name="assunto" placeholder="Assunto" required>
        <textarea name="descricao" placeholder="Descrição" required></textarea>
        <input type="date" name="data" required>
        <button>Cadastrar Atendimento</button>
    </form>

    <table>
        <tr><th>Cliente</th><th>Assunto</th><th>Status</th><th>Data</th><th>Ações</th></tr>
        {% for a in atendimentos %}
        <tr>
            <td>{{ a[1] }}</td>
            <td>{{ a[2] }}</td>
            <td>{{ a[3] }}</td>
            <td>{{ a[4] }}</td>
            <td>
                {% if a[3] == "Aberto" %}
                <a href="/concluir/{{ a[0] }}">✅ Concluir</a>
                {% endif %}
            </td>
        </tr>
        {% endfor %}
    </table>
    <br><a href="/">Voltar</a>
</body>
</html>
