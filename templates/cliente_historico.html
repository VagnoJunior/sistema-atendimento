<!DOCTYPE html>
<html>
<head>
    <title>Histórico</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<h2>{{ cliente[1] }}</h2>

<p>Telefone: {{ cliente[2] }}</p>
<p>Email: {{ cliente[3] }}</p>

<h3>Atendimentos</h3>

<ul>
{% for a in atendimentos %}
    <li>
        {{ a[0] }} — {{ a[1] }} — {{ a[2] }}
    </li>
{% else %}
    <li>Nenhum atendimento</li>
{% endfor %}
</ul>

<a href="/clientes">Voltar</a>

</body>
</html>
