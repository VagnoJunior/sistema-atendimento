<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <style>
        body { font-family: Arial; display: flex; justify-content:center; align-items:center; height:100vh; background:#f4f4f4; }
        form { background:white; padding:20px; border-radius:10px; box-shadow:0 0 10px #ccc; }
        input { display:block; margin:10px 0; padding:8px; width:250px; }
        button { padding:8px 20px; background:#28a745; color:white; border:none; cursor:pointer; }
        .erro { color:red; }
    </style>
</head>
<body>
    <form method="POST">
        <h2>Login</h2>
        {% if erro %}<p class="erro">{{ erro }}</p>{% endif %}
        <input type="email" name="email" placeholder="Email" required>
        <input type="password" name="senha" placeholder="Senha" required>
        <button>Entrar</button>
    </form>
</body>
</html>
